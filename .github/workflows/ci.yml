name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read
  actions: read # look up / download release artifacts from earlier runs

# Build once, deploy the tested artifact:
# - every run tests AND builds the production bundle (in parallel), then
#   `package` publishes `release-<tree>` only when everything is green;
#   <tree> is the git tree hash, i.e. the exact source content;
# - on push to main, `reuse` looks for an existing `release-<tree>` (e.g.
#   from the PR run that tested this exact content): when found, tests and
#   builds are skipped and that artifact is deployed as-is.
jobs:
  reuse:
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - id: find
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=release-${{ steps.tree.outputs.tree }}&per_page=20" \
            --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          if [ -n "$RUN_ID" ]; then
            echo "♻️ Reusing tested release from run $RUN_ID — skipping tests and builds"
          fi

  backend:
    needs: reuse
    if: needs.reuse.outputs.run_id == ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace

  # Release binary, built in parallel with the backend tests.
  backend-release:
    needs: reuse
    if: needs.reuse.outputs.run_id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build backend (release)
        working-directory: backend
        run: cargo build --release --bin dive-manager
      - uses: actions/upload-artifact@v4
        with:
          name: backend-bin
          path: backend/target/release/dive-manager
          retention-days: 1

  frontend:
    needs: reuse
    if: needs.reuse.outputs.run_id == ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test
      # Type-check + the production bundle actually deployed (/v2).
      - name: Type-check and build (web, /v2)
        run: npm run build:web-prod
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # Published only when tests and builds are all green: the existence of
  # `release-<tree>` means "this exact content was tested".
  package:
    needs: [reuse, backend, backend-release, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-bin
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.reuse.outputs.tree }}
          path: release/
          retention-days: 14

  # Production deploy: push to main only. Served at
  # https://www.dive-manager.com/v2 next to the legacy app (see nginx
  # config); migrations run via the systemd unit's ExecStartPre.
  deploy:
    needs: [reuse, package]
    if: >-
      !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.package.result == 'success' ||
       (needs.reuse.result == 'success' && needs.reuse.outputs.run_id != ''))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Download tested release
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.reuse.outputs.tree }}
          path: release
          run-id: ${{ needs.reuse.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Upload release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "release/*"
          target: "/tmp/dive-manager-deploy/"
          strip_components: 1
          rm: true

      - name: Install and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            SRC=/tmp/dive-manager-deploy
            DEST=/opt/dive-manager

            # Backend binary (install swaps the file; artifacts lose the exec bit).
            sudo install -o dive-manager -g dive-manager -m 755 "$SRC/dive-manager" "$DEST/bin/dive-manager"

            # Frontend: stage then swap, so nginx never serves a half-copied dir.
            sudo rm -rf "$DEST/frontend.new" "$DEST/frontend.old"
            sudo cp -r "$SRC/frontend" "$DEST/frontend.new"
            sudo chown -R dive-manager:dive-manager "$DEST/frontend.new"
            [ -d "$DEST/frontend" ] && sudo mv "$DEST/frontend" "$DEST/frontend.old"
            sudo mv "$DEST/frontend.new" "$DEST/frontend"
            sudo rm -rf "$DEST/frontend.old"

            rm -rf "$SRC"

            # ExecStartPre runs `dive-manager migrate` before serving.
            # Always dump the unit's journal on failure (restart itself can
            # fail when ExecStartPre dies, which set -e would cut short).
            fail() {
              sudo systemctl status dive-manager --no-pager -l || true
              sudo journalctl -u dive-manager -n 80 --no-pager || true
              exit 1
            }
            sudo systemctl restart dive-manager || fail
            sleep 3
            sudo systemctl is-active --quiet dive-manager || fail
            echo "✅ dive-manager deployed"

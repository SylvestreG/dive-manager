name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Type-check and build
        run: npm run build

  # Production deploy: only on push to main, only once backend AND frontend
  # checks are green. Served at https://dive-manager.com/v2 next to the legacy
  # app (see nginx config); migrations run via systemd ExecStartPre.
  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build backend (release)
        working-directory: backend
        run: cargo build --release --bin dive-manager

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (web, /v2)
        working-directory: frontend
        run: |
          npm ci
          npm run build:web-prod

      - name: Stage release
        run: |
          mkdir -p release/frontend
          cp backend/target/release/dive-manager release/
          cp -r frontend/dist/. release/frontend/

      - name: Upload release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "release/*"
          target: "/tmp/dive-manager-deploy/"
          strip_components: 1
          rm: true

      - name: Install and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            SRC=/tmp/dive-manager-deploy
            DEST=/opt/dive-manager

            # Backend binary (install -m swaps the file; safe while running).
            sudo install -o dive-manager -g dive-manager -m 755 "$SRC/dive-manager" "$DEST/bin/dive-manager"

            # Frontend: stage then swap, so nginx never serves a half-copied dir.
            sudo rm -rf "$DEST/frontend.new" "$DEST/frontend.old"
            sudo cp -r "$SRC/frontend" "$DEST/frontend.new"
            sudo chown -R dive-manager:dive-manager "$DEST/frontend.new"
            [ -d "$DEST/frontend" ] && sudo mv "$DEST/frontend" "$DEST/frontend.old"
            sudo mv "$DEST/frontend.new" "$DEST/frontend"
            sudo rm -rf "$DEST/frontend.old"

            rm -rf "$SRC"

            # ExecStartPre runs `dive-manager migrate` before serving.
            sudo systemctl restart dive-manager
            sleep 3
            sudo systemctl is-active --quiet dive-manager || {
              sudo journalctl -u dive-manager -n 50 --no-pager
              exit 1
            }
            echo "✅ dive-manager deployed"

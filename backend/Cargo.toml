[package]
name = "dive-manager-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dive-manager"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-uuid",
    "with-json",
] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
] }
lopdf = "0.34"
migration = { path = "./migration" }
ffessm = { path = "./ffessm" }
scraper = "0.27.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "charset", "json", "form"] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[workspace]
members = [".", "migration", "ffessm"]

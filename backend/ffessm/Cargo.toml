[package]
name = "ffessm"
version = "0.1.0"
edition = "2021"
description = "FFESSM / Code du Sport domain rules: certifications, aptitudes, prerogatives"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"
